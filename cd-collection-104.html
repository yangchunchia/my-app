  let H=0,S=d==0?0:d/(1-Math.abs(2*L-1));
  if(d){const R=r/255,G=g/255,B=b/255;H=mx==R?((G-B)/d)%6:mx==G?(B-R)/d+2:(R-G)/d+4;H*=60;if(H<0)H+=360}
  const f=(n,s,l)=>{const k=(n+H/30)%12,a=s*Math.min(l,1-l);return 255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))};
  const o=[];
  for(let k=1;k<=9;k++){
    let l=k<5?L+(.94-L)*(5-k)/5:k>5?L-(L-.08)*(k-5)/5:L;
    o.push({hex:k==5?h:hx([f(0,S,l),f(8,S,l),f(4,S,l)]),name:"第"+k+"階"+(k==5?"（輸入）":"")});
  }
  show("同色灰階九階",o);
};
$("bj").onclick=()=>{
  const a=val("i1"),b=val("i2");if(!a||!b)return toast("請輸入兩個色碼");
  const A=rgb(a),B=rgb(b),o=[];
  for(let k=0;k<9;k++){const t=k/8;o.push({hex:hx(A.map((v,i)=>v+(B[i]-v)*t)),name:"第"+(k+1)+"階"})}
  show("雙色九階漸層",o);
};
$("cp").onclick=()=>{
  if(cur.length!==9)return toast("需要九個顏色");
  NINE.splice(0,9,...cur.map(c=>c.hex.toUpperCase()));
  try{localStorage.setItem("cdc_nine",JSON.stringify(NINE))}catch(_){}
  $("mask").style.display="none";window.closeCT();
  applyPal();if(cfg.rand===0)lockPal();
  render();AT("已套用新的九色",2500);
};
const close=()=>$("mask").style.display="none";
$("cl").onclick=$("x").onclick=close;
function one(c){
  const w=$("pl").clientWidth-24,h=(w-12)/3,m=/^(M\d+) (.+)$/.exec(c.name),e=$("one");
  e.style.cssText="width:"+w+"px;height:"+h+"px;background:"+c.hex+";color:"+fg(c.hex);
  e.textContent=(m?m[1]:"—")+" "+(m?m[2]:c.name)+" "+c.hex;
  $("mask2").style.display="flex";copy(c.hex);
}
$("mask2").onclick=()=>$("mask2").style.display="none";
$("tg").onclick=()=>{const on=$("pl").classList.toggle("g9");$("tg").textContent=on?"卡片式":"九宮格"};
$("mask").onclick=e=>{if(e.target.id=="mask")close()};

window.openCT=()=>{const e=document.getElementById('ct');e.hidden=false;e.scrollTop=0};
window.closeCT=()=>{document.getElementById('ct').hidden=true};
document.getElementById('ct_xx').onclick=window.closeCT;
})();
